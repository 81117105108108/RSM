name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w packages/core -- --runInBand
      - run: npm run test:asset-security
      - run: npm run test:package-contents
      - run: npm --prefix studio-plugin ci
      - run: npm --prefix studio-plugin run build
      - run: npm run build
      - run: npm audit --audit-level=high
